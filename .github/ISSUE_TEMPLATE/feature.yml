name: Feature request
description: A concrete change to the plugin, UI, or docs.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Sign-in, catalog browse, and tone3000.com go to [support@tone3000.com](mailto:support@tone3000.com), not here.

  - type: checkboxes
    id: searched
    attributes:
      label: Search
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What you already tried, or another approach you would also accept.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - DSP / chain
        - Host / formats
        - UI
        - Presets / TONE3000 browse
        - MIDI
        - Installer / packaging
        - Docs / tests
        - Other
    validations:
      required: true
